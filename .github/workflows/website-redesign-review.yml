name: Website redesign review
on:
  push:
    branches: [codex/servora-marketing-redesign]
  pull_request:
    branches: [cleanup]
    paths:
      - apps/website/**
      - .agents/skills/design-taste-frontend/**
      - .github/workflows/website-redesign-review.yml
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVORA_SEO_TEST_BUILD: "true"
      NEXT_PUBLIC_SITE_URL: https://servora.ci.invalid
      NEXT_PUBLIC_APP_SIGNIN_URL: https://app.servora.ci.invalid/login
      NEXT_PUBLIC_WEB_APP_URL: https://app.servora.ci.invalid
      NEXT_PUBLIC_KITCHEN_APP_URL: https://kitchen.servora.ci.invalid
      NEXT_PUBLIC_WAITER_APP_URL: https://waiter.servora.ci.invalid
      NEXT_PUBLIC_CUSTOMER_APP_URL: https://order.servora.ci.invalid
      LEAD_WEBHOOK_URL: https://leads.servora.ci.invalid/submit
      NEXT_PUBLIC_GA_ID: G-SEOTEST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint:website && bun run typecheck:website && bun run test:website
      - run: bun run build:website
      - run: node scripts/seo/audit-built-pages.mjs --website-only
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e:website:production
      - name: Save rendered pages and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-redesign-review
          path: |
            apps/website/test-results/
            apps/website/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
