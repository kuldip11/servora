    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Servora" />
    <meta property="og:title" content="Servora — Business" />
    <meta
      property="og:description"
      content="Servora business operations, point of sale and restaurant administration."
    />
    <meta property="og:url" content="%VITE_PUBLIC_APP_URL%" />
    <meta
      property="og:image"

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:description"
      content="Servora business operations, point of sale and restaurant administration."

      name="twitter:image"
      content="%VITE_PUBLIC_APP_URL%/social/og-business.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servora — Business</title>

    <style>
      .servora-static-bootstrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 48px 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }

      [data-theme="dark"] .servora-static-bootstrap {
        background: #0f172a;
        color: #f8fafc;
      }

      [data-theme="high-contrast"] .servora-static-bootstrap {
        background: #000;
        color: #fff;
      }

      .servora-static-bootstrap__mark {
        width: 64px;
        height: 64px;
        margin: 0 auto;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #16a34a;
        color: #fff;
        font-size: 20px;
        font-weight: 700;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
      }

      .servora-static-bootstrap__title {
        margin: 24px 0 0;
        font-size: 30px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .servora-static-bootstrap__spinner {
        width: 28px;
        height: 28px;
        box-sizing: border-box;
        margin: 32px auto 0;
        border: 3px solid rgba(22, 163, 74, 0.22);
        border-top-color: #16a34a;
        border-radius: 999px;
        animation: servora-bootstrap-spin 0.8s linear infinite;
      }

      .servora-static-bootstrap__message {
        margin: 20px 0 0;
        font-size: 16px;
        line-height: 24px;
        font-weight: 500;
      }

      .servora-static-bootstrap__detail {
        max-width: 384px;
        margin: 8px auto 0;
        color: #64748b;
        font-size: 14px;
        line-height: 20px;
      }

      [data-theme="dark"] .servora-static-bootstrap__detail {
        color: #94a3b8;
      }

      [data-theme="high-contrast"] .servora-static-bootstrap__detail {
        color: #fff;
      }

      @keyframes servora-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .servora-static-bootstrap__spinner {
          animation-duration: 1.8s;
        }
      }
    </style>

    <script>
      (function () {
        try {
          var t = localStorage.getItem("pos-theme");
          var valid = t === "light" || t === "dark" || t === "high-contrast";
          document.documentElement.setAttribute(
            "data-theme",
            valid ? t : "light",
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main
        class="servora-static-bootstrap"
        data-servora-initial-loader
        aria-live="polite"
        aria-busy="true"
      >
        <section>
          <div class="servora-static-bootstrap__mark" aria-hidden="true">S</div>
          <h1 class="servora-static-bootstrap__title">Servora</h1>
          <div
            class="servora-static-bootstrap__spinner"
            aria-hidden="true"
          ></div>
          <p class="servora-static-bootstrap__message">
            Preparing your workspace…
          </p>
          <p class="servora-static-bootstrap__detail">
            Securely restoring your session and workspace.
          </p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
